<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planeador de Horarios Facico | Universidad Veracruzana</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
min-height: 100vh;
padding: 20px;
}
.container {
max-width: 1400px;
margin: 0 auto;
background: white;
border-radius: 20px;
box-shadow: 0 20px 60px rgba(0,0,0,0.3);
overflow: hidden;
}
.header {
background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
color: white;
padding: 30px;
text-align: center;
position: relative;
}
.header h1 { font-size: 2.5em; margin-bottom: 10px; }
.header p { font-size: 1.2em; opacity: 0.9; }
.back-btn {
position: absolute;
top: 20px;
left: 20px;
background: rgba(255,255,255,0.2);
color: white;
border: 2px solid rgba(255,255,255,0.5);
padding: 10px 20px;
border-radius: 10px;
cursor: pointer;
font-size: 0.95em;
transition: all 0.3s;
}
.back-btn:hover {
background: rgba(255,255,255,0.3);
transform: translateX(-3px);
}
.content { padding: 30px; }
      /* ====== PANTALLAS ====== */
    .screen {
        display: none;
        animation: fadeIn 0.4s ease-in;
    }
    .screen.active { display: block; }
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
    }
    
    .section { margin-bottom: 30px; }
    .section-title {
        font-size: 1.5em;
        color: #667eea;
        margin-bottom: 15px;
        font-weight: bold;
    }
    .section-subtitle {
        color: #666;
        margin-bottom: 20px;
        line-height: 1.6;
    }
    
    /* ====== TARJETAS DE SELECCIÓN ====== */
    .selector-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 20px;
        margin-bottom: 20px;
    }
    .option-card {
        padding: 30px;
        border: 3px solid #e0e0e0;
        border-radius: 20px;
        cursor: pointer;
        transition: all 0.3s;
        background: #f9f9f9;
        text-align: center;
    }
    .option-card:hover {
        border-color: #667eea;
        transform: translateY(-5px);
        box-shadow: 0 15px 30px rgba(102, 126, 234, 0.2);
    }
    .option-card.selected {
        border-color: #667eea;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        transform: translateY(-5px);
        box-shadow: 0 15px 30px rgba(102, 126, 234, 0.4);
    }
    .option-card .icon { font-size: 3em; margin-bottom: 15px; }
    .option-card h3 { font-size: 1.5em; margin-bottom: 10px; }
    .option-card p { font-size: 0.95em; line-height: 1.6; }
    
    /* ====== BOTONES DE NAVEGACIÓN ====== */
    .nav-buttons {
        display: flex;
        justify-content: space-between;
        gap: 15px;
        margin-top: 30px;
        flex-wrap: wrap;
    }
    .btn {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        padding: 15px 35px;
        border-radius: 12px;
        font-size: 1.1em;
        cursor: pointer;
        transition: all 0.3s;
        font-weight: bold;
    }
    .btn:hover:not(:disabled) {
        transform: translateY(-3px);
        box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
    }
    .btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
    }
    .btn-secondary {
        background: #f0f0f0;
        color: #333;
    }
    .btn-secondary:hover {
        background: #e0e0e0;
    }
    
    /* ====== LOADING ====== */
    .loading {
        text-align: center;
        padding: 40px;
        font-size: 1.2em;
        color: #667eea;
    }
    .loading-spinner {
        border: 4px solid #f3f3f3;
        border-top: 4px solid #667eea;
        border-radius: 50%;
        width: 50px;
        height: 50px;
        animation: spin 1s linear infinite;
        margin: 20px auto;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    
    .error {
        background: #fee;
        border: 2px solid #fcc;
        color: #c33;
        padding: 20px;
        border-radius: 10px;
        margin: 20px 0;
        white-space: pre-wrap;
    }
    .success {
        background: #efe;
        border: 2px solid #cfc;
        color: #3c3;
        padding: 20px;
        border-radius: 10px;
        margin: 20px 0;
    }
    
    /* ====== INDICADOR DE PASOS ====== */
    .steps-indicator {
        display: flex;
        justify-content: center;
        gap: 10px;
        margin-bottom: 30px;
    }
    .step {
        display: flex;
        align-items: center;
        gap: 8px;
    }
    .step-number {
        width: 35px;
        height: 35px;
        border-radius: 50%;
        background: #e0e0e0;
        color: #999;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: bold;
        transition: all 0.3s;
    }
    .step.active .step-number {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
    }
    .step.completed .step-number {
        background: #4caf50;
        color: white;
    }
    .step-label {
        font-size: 0.9em;
        color: #999;
    }
    .step.active .step-label { color: #667eea; font-weight: bold; }
    .step.completed .step-label { color: #4caf50; }
    .step-connector {
        width: 30px;
        height: 2px;
        background: #e0e0e0;
        align-self: center;
    }
    
    /* ====== GRID HORARIO ESCOLARIZADO ====== */
    .horario-grid {
        display: grid;
        grid-template-columns: 80px repeat(6, 1fr);
        gap: 3px;
        margin: 20px 0;
    }
    .grid-header {
        background: #667eea;
        color: white;
        padding: 12px 5px;
        text-align: center;
        font-weight: bold;
        border-radius: 5px;
        font-size: 0.9em;
    }
    .grid-time {
        background: #f0f0f0;
        padding: 8px 5px;
        text-align: center;
        font-weight: bold;
        border-radius: 5px;
        font-size: 0.85em;
    }
    .grid-cell {
        background: #f9f9f9;
        border: 2px solid #e0e0e0;
        padding: 6px;
        min-height: 55px;
        border-radius: 5px;
        cursor: pointer;
        transition: all 0.3s;
        font-size: 0.75em;
        position: relative;
        overflow: hidden;
    }
    .grid-cell:hover { background: #e8e8e8; border-color: #667eea; }
    .grid-cell.occupied {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border-color: #667eea;
    }
    .grid-cell.conflict {
        background: #ff6b6b !important;
        border-color: #ff0000 !important;
        animation: pulse 1s infinite;
    }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
    
    /* ====== GRID HORARIO ABIERTO (BLOQUES) ====== */
    .bloques-container {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 20px;
        margin: 20px 0;
    }
    .bloque-card {
        background: white;
        border: 2px solid #e0e0e0;
        border-radius: 15px;
        padding: 20px;
        transition: all 0.3s;
    }
    .bloque-card:hover {
        border-color: #667eea;
        box-shadow: 0 5px 15px rgba(102, 126, 234, 0.2);
    }
    .bloque-header {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        padding: 15px;
        border-radius: 10px;
        margin-bottom: 15px;
        text-align: center;
    }
    .bloque-header h3 { font-size: 1.3em; margin-bottom: 5px; }
    .bloque-header p { font-size: 0.9em; opacity: 0.9; }
    .bloque-ee-list {
        display: flex;
        flex-direction: column;
        gap: 10px;
    }
    .bloque-ee-item {
        background: #f9f9f9;
        border: 2px solid #e0e0e0;
        border-radius: 10px;
        padding: 12px;
        cursor: pointer;
        transition: all 0.3s;
        font-size: 0.9em;
    }
    .bloque-ee-item:hover {
        border-color: #667eea;
        background: #f0f4ff;
    }
    .bloque-ee-item.occupied {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border-color: #667eea;
    }
    .bloque-ee-item.conflict {
        background: #ff6b6b;
        border-color: #ff0000;
        color: white;
    }
    .bloque-ee-item h4 { font-size: 1em; margin-bottom: 5px; }
    .bloque-ee-item p { font-size: 0.85em; margin: 2px 0; }
    .bloque-empty {
        text-align: center;
        padding: 20px;
        color: #999;
        font-style: italic;
    }
    
    /* ====== STATS ====== */
    .stats {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 20px;
        margin: 20px 0;
    }
    .stat-card {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        padding: 20px;
        border-radius: 15px;
        text-align: center;
    }
    .stat-value { font-size: 2.5em; font-weight: bold; margin-bottom: 5px; }
    .stat-label { font-size: 0.9em; opacity: 0.9; }
    
    /* ====== MODAL ====== */
    .modal {
        display: none;
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background: rgba(0,0,0,0.7);
        z-index: 1000;
        align-items: center;
        justify-content: center;
    }
    .modal.active { display: flex; }
    .modal-content {
        background: white;
        border-radius: 20px;
        padding: 30px;
        max-width: 900px;
        width: 90%;
        max-height: 85vh;
        overflow-y: auto;
    }
    .modal-header {
        font-size: 1.5em;
        color: #667eea;
        margin-bottom: 20px;
        font-weight: bold;
    }
    .filter-bar {
        display: flex;
        gap: 10px;
        margin-bottom: 15px;
        flex-wrap: wrap;
    }
    .filter-bar select, .search-box {
        padding: 10px;
        border: 2px solid #e0e0e0;
        border-radius: 10px;
        font-size: 0.95em;
        background: white;
    }
    .search-box { flex: 1; min-width: 200px; }
    .search-box:focus, .filter-bar select:focus { outline: none; border-color: #667eea; }
    .ee-list { max-height: 500px; overflow-y: auto; }
    .ee-item {
        padding: 15px;
        border: 2px solid #e0e0e0;
        border-radius: 10px;
        margin-bottom: 10px;
        cursor: pointer;
        transition: all 0.3s;
    }
    .ee-item:hover { border-color: #667eea; background: #f9f9f9; }
    .ee-item h4 { color: #667eea; margin-bottom: 5px; }
    .ee-item p { font-size: 0.9em; color: #666; margin: 3px 0; }
    .ee-item.added { opacity: 0.5; cursor: not-allowed; background: #f0f0f0; }
    .area-badge {
        display: inline-block;
        background: #e0e0e0;
        color: #333;
        padding: 3px 8px;
        border-radius: 5px;
        font-size: 0.8em;
        margin-right: 5px;
    }
    
    .conflict-warning {
        background: #fff3cd;
        border: 2px solid #ffc107;
        color: #856404;
        padding: 15px;
        border-radius: 10px;
        margin: 20px 0;
        display: none;
    }
    .conflict-warning.show { display: block; }
    
    .info-box {
        background: #e3f2fd;
        border: 2px solid #90caf9;
        color: #1565c0;
        padding: 15px;
        border-radius: 10px;
        margin: 20px 0;
        font-size: 0.95em;
        line-height: 1.6;
    }
    .info-box a { color: #1565c0; font-weight: bold; }
    
    .footer {
        background: #f0f0f0;
        padding: 20px;
        text-align: center;
        color: #666;
        font-size: 0.9em;
    }
    .footer a { color: #667eea; text-decoration: none; }
    .footer a:hover { text-decoration: underline; }
    
    @media print {
        body { background: white; padding: 0; }
        .container { box-shadow: none; }
        .btn, .modal, .conflict-warning, .back-btn, .steps-indicator, .header, .footer, .stats, .info-box, .nav-buttons { display: none !important; }
        .screen { display: block !important; }
        #screen-1, #screen-2 { display: none !important; }
    }
    @media (max-width: 768px) {
        .horario-grid { grid-template-columns: 60px repeat(6, 1fr); font-size: 0.7em; }
        .grid-cell { min-height: 45px; padding: 3px; }
        .header h1 { font-size: 1.8em; }
        .step-label { display: none; }
    }
</style>
</script>
</body>
</html>
